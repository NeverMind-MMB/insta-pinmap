name = "opin"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./web"
binding = "ASSETS"

[vars]
WORK_DIFFICULTY = "18"

# Per-address limit for /api/ig. If `wrangler deploy` rejects this block on the
# free plan, delete it — worker/index.js then uses its in-memory fallback.
[[ratelimits]]
name = "IG_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Per-address limit for /api/guide (same note as above).
[[ratelimits]]
name = "GUIDE_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Per-address limit for /api/post (YouTube and Facebook; same note as above).
[[ratelimits]]
name = "POST_LIMIT"
namespace_id = "1004"
simple = { limit = 20, period = 60 }
