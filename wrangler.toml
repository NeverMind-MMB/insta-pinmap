name = "insta-pinmap"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./web"
binding = "ASSETS"

[vars]
WORK_DIFFICULTY = "18"

# Per-address limit for /api/ig. If `wrangler deploy` rejects this block on the
# free plan, delete it — worker/index.js then uses its in-memory fallback.
[[ratelimits]]
name = "IG_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Per-address limit for /api/apple-places (each call looks up to 10 places on
# maps.apple.com). Same rule as above: without the block an in-memory limit applies.
[[ratelimits]]
name = "APPLE_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
